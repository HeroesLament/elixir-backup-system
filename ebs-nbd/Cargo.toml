[package]
name = "ebs-nbd"
version = "0.1.0"
edition = "2021"

[lib]
name = "ebs_nbd"
crate-type = ["rlib"]

[[bin]]
name = "ebs-nbd-daemon"
path = "src/bin/daemon.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Erlang term format + distribution
erlang-term = "0.1"

# Hashing
sha2 = "0.10"
hex = "0.4"

# Networking
ssh2 = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
bytes = "1.5"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
